name: Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build for deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Ready for deployment
        run: echo "dist/ is ready — deployment handled by Cloudflare Pages GitHub integration"
